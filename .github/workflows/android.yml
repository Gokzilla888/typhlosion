name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    # Ubuntu 24.04 runners ship with the Android SDK installed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          echo "Android SDK: $ANDROID_HOME"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../typhlosion-weather.apk
      - uses: actions/upload-artifact@v4
        with:
          name: typhlosion-weather-apk
          path: typhlosion-weather.apk
      - name: Publish to the "Latest APK" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APK
          prerelease: true
          make_latest: false
          body: |
            Android build of commit ${{ github.sha }} (build ${{ github.run_number }}).
            Download typhlosion-weather.apk on your phone and open it to install.
          files: typhlosion-weather.apk
